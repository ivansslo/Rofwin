apply plugin: 'com.android.application'

def contentBaseUrlValue = (project.findProperty("contentBaseUrl") ?: System.getenv("CONTENT_BASE_URL") ?: "https://raw.githubusercontent.com/ivansslo/rofwin/main/").toString()
if (!contentBaseUrlValue.endsWith("/")) contentBaseUrlValue += "/"

def repoUrlValue = (project.findProperty("repoUrl") ?: System.getenv("REPO_URL") ?: "https://github.com/ivansslo/rofwin").toString()

def releaseStoreFileValue = (project.findProperty("ANDROID_KEYSTORE_PATH") ?: System.getenv("ANDROID_KEYSTORE_PATH") ?: "").toString()
def releaseStorePasswordValue = (project.findProperty("ANDROID_STORE_PASSWORD") ?: System.getenv("ANDROID_STORE_PASSWORD") ?: "").toString()
def releaseKeyAliasValue = (project.findProperty("ANDROID_KEY_ALIAS") ?: System.getenv("ANDROID_KEY_ALIAS") ?: "").toString()
def releaseKeyPasswordValue = (project.findProperty("ANDROID_KEY_PASSWORD") ?: System.getenv("ANDROID_KEY_PASSWORD") ?: "").toString()

android {
    namespace 'com.rofwin'
    compileSdk 34
    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.rofwin'
        minSdk 26
        targetSdk 28
        versionCode 100
        versionName "1.0.0"
        buildConfigField "String", "CONTENT_BASE_URL", "\"${contentBaseUrlValue}\""
        buildConfigField "String", "REPO_URL", "\"${repoUrlValue}\""
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    packaging {
        resources {
            pickFirsts += 'lib/arm64-v8a/libFLAC.so'
        }
    }

    signingConfigs {
        release {
            if (!releaseStoreFileValue.isEmpty()) {
                storeFile file(releaseStoreFileValue)
                storePassword releaseStorePasswordValue
                keyAlias releaseKeyAliasValue
                keyPassword releaseKeyPasswordValue
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters 'arm64-v8a'
            }
        }

        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters 'arm64-v8a'
            }
            if (!releaseStoreFileValue.isEmpty()) {
                signingConfig signingConfigs.release
            }
        }
    }

    lintOptions {
        checkReleaseBuilds false
    }

    ndkVersion '25.2.9519653'

    externalNativeBuild {
        cmake {
            version '3.22.1'
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    implementation 'org.tukaani:xz:1.7'
    implementation 'org.apache.commons:commons-compress:1.20'
}
